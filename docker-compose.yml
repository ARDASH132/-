services:
  db:
    image: postgres:16-alpine
    container_name: industry_db
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: industry_backend
    environment:
      DATABASE_URL: postgresql+psycopg://app:app_password@db:5432/appdb
      SECRET_KEY: dev_secret_change_later
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: